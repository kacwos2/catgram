<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catgram</title>
    <link rel="stylesheet" href="catgram.css" />
  </head>
  <body>
    <div class="background">
      <div class="header">
        <div class="left">
          <a href="Profile/profile.html" class="profile">
            <p>😺</p>
            <button class="tip">Profile</button>
          </a>
          <a href="fav/fav.html" class="favorite">
            <p>😻</p>
            <button class="tip">Favorite</button>
          </a>
          <a href="upload/upload.html" class="upload">
            <p>😼</p>
            <button class="tip">Upload</button>
          </a>
        </div>
        
        <div class="header-center">
          <p class="logo">Catgram</p>
        </div>
        
        <div class="right">
          <div class="search">
            <input class="search-bar" placeholder="Search" />
          </div>
          <button class="search-button">🙀</button>
        </div>
      </div>      
      <div class="center">
        <div class="main">
          <div class="user-name">~Dazia~</div>
          <div class="img">
            <img src="https://via.placeholder.com" alt="Cat Image"/>
          </div>
          <div class="like-share">
            <button class="emoticon">🐱</button>
            <button class="share">🔗</button>
          </div>
        </div>
        <div class="main">
          <div class="user-name">Kamil_i_ptyś</div>
          <div class="img">
            <img src="https://via.placeholder.com" alt="Cat Image"/>
          </div>
          <div class="like-share">
            <button class="emoticon">🐱</button>
            <button class="share">🔗</button>
          </div>
        </div>
        <div class="main">
          <div class="user-name">sympatyczny włoch</div>
          <div class="img">
            <img src="https://via.placeholder.com" alt="Cat Image"/>
          </div>
          <div class="like-share">
            <button class="emoticon">🐱</button>
            <button class="share">🔗</button>
          </div>
        </div>
        <div class="main">
          <div class="user-name">Gameboy</div>
          <div class="img">
            <img src="https://via.placeholder.com" alt="Cat Image"/>
          </div>
          <div class="like-share">
            <button class="emoticon">🐱</button>
            <button class="share">🔗</button>
          </div>
        </div>
        <div class="main">
          <div class="user-name">Rudyyy</div>
          <div class="img">
            <img src="https://via.placeholder.com" alt="Cat Image"/>
          </div>
          <div class="like-share">
            <button class="emoticon">🐱</button>
            <button class="share">🔗</button>
          </div>
        </div>
        <div class="main">
          <div class="user-name">lulae</div>
          <div class="img">
            <img src="https://via.placeholder.com" alt="Cat Image"/>
          </div>
          <div class="like-share">
            <button class="emoticon">🐱</button>
            <button class="share">🔗</button>
          </div>
        </div>
      </div>
      <div class="message">
        <div class="message-header">
          <p>📨 Message with Catosaur 📨</p>
        </div>
        <div class="messages">
          <p class="users-messages">You: Hello.<br /></p>
          <p class="users-messages">Catosaur: Hi!<br /></p>
          <p class="users-messages">You: How are you?<br /></p>
          <p class="users-messages">Catosaur: I'm fine, thank you!<br /></p>
          <p class="users-messages">You: What do you do?<br /></p>
          <p class="users-messages">Catosaur: I'm feeding my cat.<br /></p>
          <p class="users-messages">You: How is your cat?<br /></p>
          <p class="users-messages">Catosaur: It's fine.<br /></p>
        </div>
        <div class="send">
          <input class="message-bar" placeholder="Type your message" />
          <button class="send-button">📨</button>
        </div>
      </div>
      <script src="generate-and-api.js"></script>
    </div>
    <script src="catgram.js"></script>
  </body>
</html>
